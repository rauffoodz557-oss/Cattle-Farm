name: Build Desktop App

on:
  push:
    branches:
      - main # یا master جو بھی آپ کی برانچ کا نام ہے
  workflow_dispatch: # اس سے Actions ٹیب میں Manually چلانے کا بٹن بھی آ جائے گا

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Build EXE
        run: npx electron-builder --win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
